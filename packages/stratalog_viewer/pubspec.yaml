name: stratalog_viewer
description: "In-app log viewer for stratalog — MemoryLogWriter ring buffer plus LogViewerPage: layer chips, level filter, JSON-aware search, expandable data/error/stack, copy-to-clipboard."
version: 0.1.0
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/stratalog
issue_tracker: https://github.com/esenmx/stratalog/issues
publish_to: none
resolution: workspace

topics:
  - logging
  - debugging
  - flutter
  - observability

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  chirp: ^0.9.0
  flutter:
    sdk: flutter
  stratalog: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
